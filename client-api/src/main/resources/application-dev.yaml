spring:
  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8088

springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true